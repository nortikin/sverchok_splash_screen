  <!-- Фон -->
  <rect width="800" height="600" fill="#f5f5f5" rx="10"/>
  
  <!-- Заголовок -->
  <text x="400" y="30" text-anchor="middle" fill="#333" font-family="Arial" font-size="16" font-weight="bold">
    Сетка кружков (шаг 20px) — наведи курсор
  </text>

  <!-- Генерация кружков: 40 по горизонтали (от x=20 до 780), 28 по вертикали (от y=50 до 570) -->
  
