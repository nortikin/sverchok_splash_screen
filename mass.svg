<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      .zoom-group {
        transition: transform 0.3s ease-in-out;
        transform-origin: center;
        transform-box: fill-box;
      }
      .zoom-group:hover {
        transform: scale(1.2);
      }
      .dot {
        fill: #4ecdc4;
        stroke: #2c3e50;
        stroke-width: 2;
      }
    </style>
